name: live-eval

# Live EDD run — real model, real credentials. NEVER on pull_request:
# it costs money and needs secrets, so it is manual or scheduled only.
on:
  workflow_dispatch:
    inputs:
      langsmith:
        description:
          "Also publish a LangSmith experiment (requires LANGCHAIN_API_KEY)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      TRACING_PROVIDER: "langfuse"
      # Cheap guard rail: cap per-job LLM spend during the live run.
      DEFAULT_JOB_BUDGET_USD: "0.08"
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/setup-uv@v9.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # Live eval is informational: failures surface as a failing workflow
      # run plus artifacts — they never block PRs. --langfuse-live publishes
      # a real-model Langfuse experiment (spends real tokens); Langfuse is
      # the active live backend (docs/eval/why-langfuse.md).
      - name: Run live evaluation (Langfuse)
        run: uv run python -m evaluation.run_eval --report --langfuse-live
        continue-on-error: false

      # Opt-in only — LangSmith quota is intermittent; trigger it from
      # workflow_dispatch when a comparison run is actually needed.
      - name: Optional LangSmith experiment
        if: inputs.langsmith == true
        env:
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          TRACING_PROVIDER: "langsmith"
        run: uv run python -m evaluation.run_eval --report --langsmith-live

      # actions/upload-artifact@v7.0.2
      - name: Upload scorecard + trend artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-eval-scorecard
          path: |
            evaluation/results/scorecard.json
            evaluation/results/history.jsonl
            evaluation/results/TREND.md
          retention-days: 90

      # history.jsonl may differ after a live run — surface the diff as an
      # artifact; merging updated trend files is a deliberate human PR.
      - name: Trend diff (for manual PR)
        run: git diff -- evaluation/results/ > trend.diff || true

      # actions/upload-artifact@v7.0.2
      - name: Upload trend diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-eval-trend-diff
          path: trend.diff
          retention-days: 30
