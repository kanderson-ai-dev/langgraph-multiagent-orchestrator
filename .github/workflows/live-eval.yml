name: live-eval

# Live EDD run — real model, real credentials. NEVER on pull_request:
# it costs money and needs secrets, so it is manual or scheduled only.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_TRACING_V2: "true"
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/setup-uv@v9.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # Live eval is informational: failures surface as a failing workflow
      # run plus artifacts — they never block PRs. --langsmith-live publishes
      # a real-model LangSmith experiment (spends real tokens).
      - name: Run live evaluation
        run: uv run python -m evaluation.run_eval --report --langsmith-live
        continue-on-error: false

      # actions/upload-artifact@v7.0.2
      - name: Upload scorecard + trend artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-eval-scorecard
          path: |
            evaluation/results/scorecard.json
            evaluation/results/history.jsonl
            evaluation/results/TREND.md
          retention-days: 90

      # history.jsonl may differ after a live run — surface the diff as an
      # artifact; merging updated trend files is a deliberate human PR.
      - name: Trend diff (for manual PR)
        run: git diff -- evaluation/results/ > trend.diff || true

      # actions/upload-artifact@v7.0.2
      - name: Upload trend diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-eval-trend-diff
          path: trend.diff
          retention-days: 30
