name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: mypy (strict)
        run: uv run mypy --strict app/

      - name: pytest + coverage
        run: uv run pytest -v --cov=app --cov-report=term-missing
        env:
          OPENAI_API_KEY: ""
          SEARCH_API_KEY: ""
          LANGCHAIN_API_KEY: ""
          JWT_SECRET_KEY: ""

      - name: pip-audit
        run: uv run pip-audit --strict
        continue-on-error: true # Phase 10: make blocking once the dep tree stabilizes
