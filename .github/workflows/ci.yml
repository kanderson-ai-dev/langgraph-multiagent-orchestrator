name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: mypy (strict)
        run: uv run mypy --strict app/

      - name: pytest + coverage (≥80% on app/)
        run: uv run pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80
        env:
          OPENAI_API_KEY: ""
          SEARCH_API_KEY: ""
          LANGCHAIN_API_KEY: ""
          JWT_SECRET_KEY: ""

      - name: EDD quality gate
        run: uv run python -m evaluation.run_eval
        env:
          OPENAI_API_KEY: ""
          SEARCH_API_KEY: ""

      - name: pip-audit
        run: uv run pip-audit --strict

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
