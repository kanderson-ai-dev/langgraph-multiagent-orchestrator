name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/setup-uv@v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Lockfile consistency
        run: uv lock --check

      - name: requirements.txt is regenerated, not hand-edited
        run: |
          uv export --format requirements-txt --all-groups --no-hashes \
            -o requirements.ci.txt
          # Skip the 2-line autogen header (it embeds the -o path).
          diff <(tail -n +3 requirements.txt) <(tail -n +3 requirements.ci.txt)
          rm requirements.ci.txt

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: mypy (strict, py3.11 baseline)
        if: matrix.python-version == '3.11'
        run: uv run mypy --strict app/

      - name: pytest + coverage (≥85% on app/)
        run: >
          uv run pytest -v
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
        env:
          OPENAI_API_KEY: ""
          SEARCH_API_KEY: ""
          LANGCHAIN_API_KEY: ""
          JWT_SECRET_KEY: ""

      - name: Coverage artifact
        if: matrix.python-version == '3.11'
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

      - name: Browser E2E smoke test (console UI, py3.12)
        if: matrix.python-version == '3.12'
        run: |
          uv run --with playwright playwright install --with-deps chromium
          uv run --with playwright pytest tests/test_frontend_e2e.py -v

      - name: EDD quality gate
        run: uv run python -m evaluation.run_eval
        env:
          OPENAI_API_KEY: ""
          SEARCH_API_KEY: ""

      - name: pip-audit
        run: uv run pip-audit --strict

      # gitleaks/gitleaks-action@v3.0.0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build image
        run: docker build -t orchestrator:ci .

      - name: Container smoke test
        run: |
          docker run -d --name app -p 8000:8000 orchestrator:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health | tee health.json
          test "$(docker exec app id -u)" = "10001" || {
            echo "container must not run as root"; exit 1; }
          docker logs app | tail -20

      - name: Compose smoke test
        run: |
          docker compose config --quiet
          docker compose up -d --wait orchestrator
          curl -sf --retry 10 --retry-delay 3 --retry-all-errors \
            http://localhost:8000/api/v1/health
          docker compose down -v

      - name: Container logs on failure
        if: failure()
        run: docker logs app 2>/dev/null || docker compose logs 2>/dev/null || true

  sbom:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate SBOM (CycloneDX, from the locked manifest)
        run: |
          uvx --from cyclonedx-bom cyclonedx-py requirements \
            requirements.txt -o sbom.cdx.json --of JSON
          python -c \
            "import json;d=json.load(open('sbom.cdx.json'));\
             assert d['bomFormat']=='CycloneDX' and len(d['components'])>10"

      - name: Upload SBOM
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
