# Optional Postgres backend — NOT part of the default compose stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up
#
# The app switches on STORAGE_BACKEND=postgres + DATABASE_URL; schemas
# auto-migrate on first use (no separate migration step needed for dev).
# For a bare local Postgres for the contract suite instead:
#
#   docker run -d --name orx-pg -p 55432:5432 \
#     -e POSTGRES_USER=orx -e POSTGRES_PASSWORD=orx_test -e POSTGRES_DB=orx \
#     postgres:17-alpine
#   TEST_DATABASE_URL=postgresql://orx:orx_test@localhost:55432/orx \
#     uv run pytest tests/test_store_contract.py

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orx} -d ${POSTGRES_DB:-orchestrator}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  orchestrator:
    environment:
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-orx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestrator}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
