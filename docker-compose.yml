services:
  orchestrator:
    build: .
    image: langgraph-multiagent-orchestrator
    labels:
      org.opencontainers.image.authors: "Kaarsten Anderson <contact@kaarstenanderson.com>"
    ports:
      - "${PORT:-8000}:8000"
    # Optional: place real keys in .env (gitignored) — without them the app
    # still runs end-to-end on the deterministic StubLLM + keyless search.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/orchestrator.sqlite
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite
      ENVIRONMENT: production
    volumes:
      - orchestrator-data:/app/data
    # Runtime hardening: read-only root fs (the /app/data volume stays
    # writable — SQLite WAL journals live beside the DB), scratch /tmp,
    # no capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  orchestrator-data:
