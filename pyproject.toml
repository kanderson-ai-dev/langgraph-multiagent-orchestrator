[project]
name = "langgraph-multiagent-orchestrator"
version = "0.2.0"
description = "Supervisor-Workers multi-agent B2B report orchestration microservice (FastAPI + LangGraph)"
authors = [{ name = "Kaarsten Anderson", email = "contact@kaarstenanderson.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.21.0",
    "asyncpg>=0.32.0",
    "bcrypt>=4.3.0",
    "beautifulsoup4>=4.13.0",
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "fonttools>=4.66.0",
    "fpdf2>=2.8",
    "h2>=4.2,<5",
    "httpx>=0.28.0",
    "langchain>=1.4.5",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langfuse==4.17.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-postgres>=2.0.21",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "lxml>=5.3.0",
    "pdfplumber>=0.11.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "structlog>=25.0.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.9",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
anchoring = [
    "rfc3161-client>=1.0.9,<2",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.39.0",
    "mypy>=1.14.0",
    "pip-audit>=2.7.0",
    "playwright>=1.63.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-recording>=0.14.0",
    "respx>=0.22.0",
    "rfc3161-client>=1.0.9,<2",
    "ruff>=0.9.0",
    "types-beautifulsoup4>=4.12.0",
    "types-pyyaml>=6.0.12.20260906",
    "vcrpy>=8.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "evaluation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Leaked database connections — sync (sqlite3) or async (aiosqlite) —
    # mean a store or task was orphaned at teardown. Message-matched
    # because __del__-issued warnings attribute to wherever GC runs.
    "error:unclosed database:ResourceWarning",
    "error:.*deleted before being closed:ResourceWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "requires_openai_key: needs a real OPENAI_API_KEY",
    "requires_search_api: needs a real SEARCH_API_KEY",
    "requires_langsmith_key: needs a real LANGCHAIN_API_KEY",
    "requires_browser: needs playwright + a chromium/chrome binary",
]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "ddgs.*", "langgraph_checkpoint_sqlite.*"]
ignore_missing_imports = true

# asyncpg ships no py.typed marker (installed but untyped upstream).
[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # Live-Postgres backend — covered by the contract suite under
    # TEST_DATABASE_URL (CI postgres service job), not the offline run.
    "app/services/pg/*",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
