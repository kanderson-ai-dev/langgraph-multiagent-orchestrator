# Multi-replica overrides. NOTE: `docker compose` merges this file
# automatically whenever it exists — `docker compose up` starts the Redis
# service below too. To run the app alone, either delete/rename this file
# or point at the base only:
#
#   docker compose -f docker-compose.yml up
#
# Adds a Redis service for multi-replica deployments. With REDIS_URL set
# the app auto-selects RedisRateLimiter + RedisEventBus so rate limits
# and SSE event fan-out work across N replicas.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    # For >1 replica, deploy behind a load balancer (jobs are created on
    # the replica that receives the POST but their events are visible to
    # every replica via the Redis event bus).

volumes:
  redis-data:
